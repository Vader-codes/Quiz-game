<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Game</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <div class="screen active" id="start-screen">
        <h1>Quiz Time!</h1>
        <p>Test your Knowledge with these fun questions.</p>
        <button id="start-btn">START</button>
      </div>
      <div class="screen" id="quiz-screen">
        <div class="quiz-header">
          <h2 id="question-text">Question goes here.</h2>
          <div id="quiz-info">
            <p>
              Question <span id="current-question">1</span>of <span>5</span>
            </p>
            <p>Score: <span id="score">0</span></p>
          </div>
        </div>
        <div class="answer-container" id="answer-container">
          <!-- answer tabs are going to be here from the javascript code-->
        </div>
        <div class="progress-bar">
          <div id="progress" class="progress"></div>
        </div>
      </div>
      <div id="result-screen" class="screen">
        <h1>Quiz Results</h1>
        <div id="quiz-result-info">
          <p>
            You scored <span id="fianl-score">0</span>out of
            <span id="max-score">5</span>
          </p>
          <div id="result-message">
            Good job
            <!-- something based on the correct answer , we can complete this from javascript -->
          </div>
        </div>
        <button id="restart-btn ">Restart Quiz</button>
      </div>
    </div>
  </body>
</html>
